name: Chatbot OIDC precheck
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  precheck:
    if: github.ref == 'refs/heads/chatbot'
    environment: chatbot-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: KW-coworker/JJIKMUK-Backend
          ref: f6a7eeeb17de526c17920a01ecfbb86cfaacab78
          persist-credentials: false
      - name: Verify actual chatbot OIDC without AWS
        env:
          OIDC_ENVIRONMENT: chatbot-production
        run: python3 -B ops/operations/oidc_precheck.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: chatbot-oidc-precheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: operation-results/
          if-no-files-found: error
          retention-days: 14
