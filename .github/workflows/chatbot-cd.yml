name: Chatbot CD
on:
  pull_request:
    branches: [chatbot]
  push:
    branches: [chatbot]
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: chatbot-production-deployment
  cancel-in-progress: false
jobs:
  cd:
    uses: KW-coworker/JJIKMUK-Backend/.github/workflows/chatbot-release.yml@bdbb02b164381ef3d13aee413a627fdb5057c3be
    with:
      controller_ref: bdbb02b164381ef3d13aee413a627fdb5057c3be
      enabled: ${{ vars.CHATBOT_CD_ENABLED == 'true' }}
